# ==============================================================================
# SentinelMail Render Blueprint (Infrastructure-as-Code)
# Deploys Managed PostgreSQL, Backend API Service, and Frontend Web Service
# ==============================================================================

databases:
  - name: sentinelmail-db
    databaseName: sentinelmail
    user: sentinel
    plan: free

services:
  # ----------------------------------------------------------------------------
  # 1. SentinelMail Backend API Server
  # ----------------------------------------------------------------------------
  - type: web
    name: sentinelmail-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev
    startCommand: node --import tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelmail-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: IPINFO_TOKEN
        sync: false
      - key: M365_CLIENT_STATE
        generateValue: true # Secure random string
      - key: PUBSUB_VERIFICATION_TOKEN
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. SentinelMail Frontend SSR UI (TanStack Start / Nitro)
  # ----------------------------------------------------------------------------
  - type: web
    name: sentinelmail-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sentinelmail-api
          property: host
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_GOOGLE_CLIENT_ID
        value: 201595122013-8ebtblbm36qmsfarjubj7ivjp7p8158b.apps.googleusercontent.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBnTvq6iOxjPB0M8jdzuD6ORLFTdj43W3o
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: sentinelmail-c8269.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: sentinelmail-c8269
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: sentinelmail-c8269.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "201595122013"
      - key: VITE_FIREBASE_APP_ID
        value: 1:201595122013:web:2c38afb5f79a531a29f8b4
